# SPDX-License-Identifier: GPL-3.0-or-later
# lyu323 A32 4.19-port-kit (2026-11-24). NEW file; NOT upstream source.
#
# Fetch the UNMODIFIED official v0.9.5 Manager APK from the upstream Release,
# publish it with the exact upstream source + both GPL licenses + the A32 kit.
name: Publish A32 4.19 port-kit release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official v0.9.5 Manager APK
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 5 --max-time 600 \
            -o KernelSU_v0.9.5_11872-release.apk \
            "https://github.com/tiann/KernelSU/releases/download/v0.9.5/KernelSU_v0.9.5_11872-release.apk"
          test "$(stat -c%s KernelSU_v0.9.5_11872-release.apk)" -eq 8527498
          python3 -c "import zipfile; assert zipfile.is_zipfile('KernelSU_v0.9.5_11872-release.apk'); print('official APK ok')"

      - name: Fetch exact upstream v0.9.5 source zip
        run: |
          set -e
          curl -fL --retry 4 --max-time 600 \
            -o KernelSU-v0.9.5-source.zip \
            "https://codeload.github.com/tiann/KernelSU/zip/refs/tags/v0.9.5"
          python3 -c "import zipfile; z=zipfile.ZipFile('KernelSU-v0.9.5-source.zip'); n=z.namelist(); assert any(x.endswith('/LICENSE') for x in n); assert any(x.endswith('kernel/LICENSE') for x in n); print('source files', len(n))"

      - name: Pack A32 kit and licenses
        run: |
          set -e
          ( cd a32-kit && zip -qr ../a32-kit.zip . )
          cp kernel/LICENSE kernel-LICENSE
          cp A32_RELEASE_NOTES.md README-zh.md
          ls -lh KernelSU_v0.9.5_11872-release.apk KernelSU-v0.9.5-source.zip a32-kit.zip LICENSE kernel-LICENSE

      - name: Create Release a32-kit-1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete a32-kit-1 --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create a32-kit-1 \
            --title "OPPO A32 / 4.19 port-kit 1 (source + official v0.9.5 Manager)" \
            --notes-file A32_RELEASE_NOTES.md \
            KernelSU_v0.9.5_11872-release.apk \
            KernelSU-v0.9.5-source.zip \
            a32-kit.zip LICENSE kernel-LICENSE README-zh.md
          echo "release created"
