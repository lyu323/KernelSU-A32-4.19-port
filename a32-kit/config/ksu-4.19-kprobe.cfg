# lyu323 A32 4.19-port-kit (2026-11-24). NEW file; NOT upstream source.
# 路线 A：kprobe 自动集成（4.19 官方推荐）
# 合并进本机型的 defconfig / .config，并用 make menuconfig 核对依赖
CONFIG_KSU=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_MODULES=y
# KSU Kconfig 是 depends on KPROBES && EXT4_FS，EXT4_FS 必须开，否则看不到 CONFIG_KSU
CONFIG_EXT4_FS=y
